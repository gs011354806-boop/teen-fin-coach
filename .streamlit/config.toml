# 색과 글꼴은 이 파일에서만 정한다. (나머지 모양은 style.css)
# 2026-11-13 귀여운 버전 리디자인: 파스텔 바탕은 style.css에서 아래 색을 흰색과 섞어 만든다.
# style.css는 아래 색을 var(--이름)으로 쓴다. 이름 대응은 ui_common.THEME_VARS.

[client]
showSidebarNavigation = false   # 화면 이동은 아래 탭 바와 홈 목록으로
toolbarMode = "minimal"

[theme]
base = "light"
primaryColor = "#2F6FE4"            # 주요 파랑 (탭 선택, 주요 버튼)
backgroundColor = "#F4F7FB"         # 화면 바탕 (아주 옅은 하늘색)
secondaryBackgroundColor = "#FFFFFF" # 카드·입력칸 흰색
textColor = "#1F2A44"
linkColor = "#2F6FE4"
borderColor = "#E3E8F2"
showWidgetBorder = true

blueColor = "#2F6FE4"
greenColor = "#1E9A5E"              # 모으기 · 칭찬
violetColor = "#6A4FD8"             # 뉴스 · 배우기
yellowColor = "#FFC93C"             # 포인트 · 마스코트 틴이
orangeColor = "#E0621B"             # 쓰기
redColor = "#E5484D"
grayColor = "#5B6785"               # 보조 글자 (밝은 바탕에서 4.5:1 이상)

chartCategoricalColors = ["#2F6FE4", "#1E9A5E", "#6A4FD8", "#FFC93C", "#E0621B", "#E5484D"]

font = "Pretendard Variable:https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css, -apple-system, sans-serif"
headingFont = "Pretendard Variable, -apple-system, sans-serif"  # 제목·큰 숫자: 깔끔한 굵은 글꼴 (합친 버전)
# 둥근 글꼴(귀여운 버전)로 되돌리려면 위 줄과 아래 두 굵기를 이렇게 바꾼다:
#   headingFont = "Jua:https://fonts.googleapis.com/css2?family=Jua&display=swap, Pretendard Variable, sans-serif"
#   headingFontWeights = [400, 400, 400, 400, 400, 400] / metricValueFontWeight = 400
baseFontSize = 16
headingFontWeights = [700, 700, 700, 700, 700, 700]
headingFontSizes = ["1.75rem", "1.4rem", "1.2rem", "1.05rem", "1rem", "1rem"]
metricValueFontSize = "1.6rem"
metricValueFontWeight = 700
baseRadius = "20px"
buttonRadius = "999px"                # 알약 버튼

[theme.sidebar]
backgroundColor = "#FFFFFF"
